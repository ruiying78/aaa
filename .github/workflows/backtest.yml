name: AAA 백테스트

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p docs && python backtest.py docs/backtest.json && python backtest_long.py docs/backtest_long.json && python grid.py docs/grid.json && python erc.py docs/erc.json && python country.py docs/country.json
      - name: 결과 커밋
        run: |
          git config user.name "aaa-bot"
          git config user.email "aaa-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "백테스트 결과"
          git push
