name: AAA 리밸런싱 자동 갱신

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 평일 미국장 마감 후 (UTC 22:17 = 베이징 06:17)
  workflow_dispatch:           # Actions 탭에서 '지금 실행' 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p docs && python aaa_rebalance.py --public --no-open --out docs/index.html
      - name: 결과 커밋
        run: |
          git config user.name "aaa-bot"
          git config user.email "aaa-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "리밸런싱 갱신 $(date -u +%F)"
          git push
